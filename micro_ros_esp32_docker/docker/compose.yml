services:
  ros2_agent:
    build:
      context: ..                 # Projektroot
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - AGENT_VERBOSITY=${AGENT_VERBOSITY}
      - SERIAL_DEV=${SERIAL_DEV}
      - SERIAL_GLOB=${SERIAL_GLOB}
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

    volumes:
      - ../ws:/ws
    restart: unless-stopped
    tty: true
    stdin_open: true
