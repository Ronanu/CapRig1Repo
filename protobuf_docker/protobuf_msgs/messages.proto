import "nanopb.proto";
syntax = "proto3";

message ToEsp32 {
  uint64 timestamp = 1;
  string command = 2 [(nanopb).max_size = 32];
  string payload = 3 [(nanopb).max_size = 64];
  uint32 hash = 4;
}

message FromEsp32 {
  uint64 timestamp = 1;
  float temperature = 2;
  float humidity = 3;
  string status = 4 [(nanopb).max_size = 32];
  uint32 hash = 5;
}
