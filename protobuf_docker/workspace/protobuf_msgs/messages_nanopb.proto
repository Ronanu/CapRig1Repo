syntax = "proto3";
import "nanopb.proto";

// ---------- Commands to ESP32 ----------
message Ping {}
message GetSettings {}
message SetSettings {
  SystemSettings settings = 1;
}

// ---------- Generic responses/info ----------
message Ack {}
message Info  { string message = 1 [(nanopb).max_size = 128]; }
message Error { string error   = 1 [(nanopb).max_size = 128]; }
message Debug { string text    = 1 [(nanopb).max_size = 128]; }

// ---------- Settings ----------
message SystemSettings {
  bool   current_signal_selection_state = 1;
  uint32 action_state                   = 2;
  bool   sample_streaming_enabled       = 3; // NEW
}

// ---------- Data ----------
message SensorSample {
  uint32 sensor_id = 1;
  float  value     = 2;
  uint32 checksum  = 3;
}

// ---------- Envelope: PC -> ESP ----------
message ToEsp32 {
  uint32 seq = 1;

  oneof command {
    Ping        ping         = 10;
    GetSettings get_settings = 11;
    SetSettings set_settings = 12;
  }
}

// ---------- Envelope: ESP -> PC ----------
message FromEsp32 {
  uint32 seq       = 1;
  uint32 timestamp = 2;

  oneof response {
    Ack            ack      = 10;
    Info           info     = 11;
    Error          error    = 12;
    Debug          debug    = 13;
    SystemSettings settings = 14;
    SensorSample   sample   = 15;
  }
}
