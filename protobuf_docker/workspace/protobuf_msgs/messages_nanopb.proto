syntax = "proto3";

import "nanopb.proto";

// ------------------------------------------------------------
// Protocol overview
// - ToEsp32:  commands sent to the ESP32
// - FromEsp32: responses and notifications from the ESP32
// ------------------------------------------------------------

// ============================
// System types
// ============================
message SystemSettings {
  bool  current_signal_selection_state = 1; // true = active
  uint32 action_state                  = 2; // 0..3 (validated in firmware)
}

// ============================
// Commands to ESP32 (payloads)
// ============================
message Ping {}
message GetSettings {}
message SetSettings {
  SystemSettings settings = 1;
}
message SetMux {
  uint32 channel = 1;
}

// ============================
// Wrapper: ToEsp32
// ============================
message ToEsp32 {
  uint32 seq = 1; // request id, 0 if unused

  oneof command {
    Ping        ping         = 10;
    GetSettings get_settings = 11;
    SetSettings set_settings = 12;
    SetMux      set_mux      = 13;
  }
}

// ============================
// Responses from ESP32 (payloads)
// ============================
message Ack {
  string message = 1 [(nanopb).max_size = 64];
}
message Error {
  string error = 1 [(nanopb).max_size = 64];
}
message Debug {
  string text = 1 [(nanopb).max_size = 128];
}
message SettingsState {
  SystemSettings settings = 1;
}
message SensorSample {
  uint32 sensor_id = 1;
  float  value     = 2;
  uint32 checksum  = 3;
}

// ============================
// Wrapper: FromEsp32
// ============================
message FromEsp32 {
  uint32 seq       = 1; // mirrors request id (0 for unsolicited)
  uint32 timestamp = 2; // device-side timestamp (e.g., micros)

  oneof response {
    Ack           ack      = 10;
    Error         error    = 11;
    Debug         debug    = 12;
    SettingsState settings = 13;
    SensorSample  sample   = 14;
  }
}
